name: build-ffmpeg-ndi-win-x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_TAG: n9.0.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision NDI SDK (innoextract, silent-install fallback)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CI = "true"

          # --- helper: find the SDK root and stage a flat ndi-sdk/ folder ----------
          $stageSdK = {
            param([string]$root)
            $hdr = Get-ChildItem -Path $root -Recurse -Filter "Processing.NDI.Lib.h" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hdr) {
              Write-Host "=== full tree under $root (diagnostic) ==="
              Get-ChildItem -Path $root -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
              throw "Processing.NDI.Lib.h not found under $root"
            }
            $d = $hdr.Directory
            while ($d -and -not (Test-Path (Join-Path $d.FullName "Include"))) { $d = $d.Parent }
            if (-not $d) { throw "SDK root (dir containing Include) not found from $($hdr.FullName)" }
            $lib = Get-ChildItem -Path $d.FullName -Recurse -Filter "Processing.NDI.Lib.x64.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
            $dll = Get-ChildItem -Path $d.FullName -Recurse -Filter "Processing.NDI.Lib.x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $lib) { throw "Processing.NDI.Lib.x64.lib not found under $($d.FullName)" }
            if (-not $dll) { throw "Processing.NDI.Lib.x64.dll not found under $($d.FullName)" }
            Write-Host ("SDK root: " + $d.FullName)
            Write-Host ("Lib: " + $lib.FullName)
            Write-Host ("Dll: " + $dll.FullName)
            New-Item -ItemType Directory -Force -Path ndi-sdk | Out-Null
            Copy-Item (Join-Path $d.FullName "Include\*.h") ndi-sdk/
            Copy-Item $lib.FullName "ndi-sdk/Processing.NDI.Lib.x64.lib"
            Copy-Item $dll.FullName "ndi-sdk/Processing.NDI.Lib.x64.dll"
            $ver = Get-ChildItem -Path $d.FullName -Recurse -Filter "Version.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ver) { Copy-Item $ver.FullName ndi-sdk/Version.txt }
            # fallback GNU import-lib alias (CI regenerates a proper one with dlltool)
            Copy-Item $lib.FullName "ndi-sdk/libndi.dll.a"
            Get-ChildItem ndi-sdk | Format-Table Name, Length
          }

          # --- primary: innoextract (unparses Inno payloads without executing) ----
          & curl.exe -L -sS -o innoextract.zip "https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip"
          if ($LASTEXITCODE -ne 0) { throw "innoextract download failed" }
          Expand-Archive -Path innoextract.zip -DestinationPath innoextract -Force
          & .\innoextract\innoextract.exe --version

          & .\innoextract\innoextract.exe --output ndi-sdk-inno "sdk/NDI6-SDK.exe"
          if ($LASTEXITCODE -eq 0) {
            Write-Host "innoextract succeeded, staging SDK..."
            & $stageSdK "ndi-sdk-inno"
            exit 0
          }

          Write-Host "WARN: innoextract could not parse this Inno Setup version (rc=$LASTEXITCODE). Falling back to silent install on this disposable CI runner."

          # --- fallback: silent install (Inno flags) on the disposable runner -----
          $installDir = "C:\ndi-sdk-install"
          & "sdk\NDI6-SDK.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="$installDir"
          Start-Sleep -Seconds 3

          # The installer may honor /DIR or default to Program Files; search both.
          $roots = @($installDir, "C:\Program Files", "C:\Program Files (x86)") | Where-Object { Test-Path $_ }
          $found = $null
          foreach ($r in $roots) {
            $h = Get-ChildItem -Path $r -Recurse -Filter "Processing.NDI.Lib.h" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($h) { $found = $h; break }
          }
          if (-not $found) {
            Write-Host "=== candidate trees (diagnostic) ==="
            foreach ($r in $roots) {
              Write-Host "--- $r ---"
              Get-ChildItem -Path $r -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*NDI*" } | ForEach-Object {
                Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
              }
            }
            throw "silent install did not produce Processing.NDI.Lib.h (see diagnostic above)"
          }
          # anchor to the dir that contains Include
          $d = $found.Directory
          while ($d -and -not (Test-Path (Join-Path $d.FullName "Include"))) { $d = $d.Parent }
          if (-not $d) { throw "SDK root (dir containing Include) not found from $($found.FullName)" }
          Write-Host "NDI SDK installed to: $($d.FullName)"

          # stage flat ndi-sdk/ from the installed location
          $lib = Get-ChildItem -Path $d.FullName -Recurse -Filter "Processing.NDI.Lib.x64.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
          $dll = Get-ChildItem -Path $d.FullName -Recurse -Filter "Processing.NDI.Lib.x64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lib) { throw "Processing.NDI.Lib.x64.lib not found under $($d.FullName)" }
          if (-not $dll) { throw "Processing.NDI.Lib.x64.dll not found under $($d.FullName)" }
          New-Item -ItemType Directory -Force -Path ndi-sdk | Out-Null
          Copy-Item (Join-Path $d.FullName "Include\*.h") ndi-sdk/
          Copy-Item $lib.FullName "ndi-sdk/Processing.NDI.Lib.x64.lib"
          Copy-Item $dll.FullName "ndi-sdk/Processing.NDI.Lib.x64.dll"
          $ver = Get-ChildItem -Path $d.FullName -Recurse -Filter "Version.txt" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ver) { Copy-Item $ver.FullName ndi-sdk/Version.txt }
          Copy-Item $lib.FullName "ndi-sdk/libndi.dll.a"
          Get-ChildItem ndi-sdk | Format-Table Name, Length
          Write-Host "NDI SDK provisioned via silent install fallback"

      - name: Show NDI SDK version
        shell: bash
        run: cat ndi-sdk/Version.txt 2>/dev/null || echo "(no Version.txt)"

      - name: Setup MSYS2 (ucrt64 cross toolchain)
        id: msys2
        # NOTE: the action's input is 'msystem' (NOT 'msys2-arch'); with the wrong
        # name it is silently ignored and the action defaults to MSYSTEM=MINGW64,
        # putting /mingw64/bin (not /ucrt64/bin) on PATH -> 'command not found'
        # for x86_64-w64-mingw32-* and a failed C-compiler test in configure.
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make
            patch
            diffutils
            coreutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python

      # The action only exports MSYSTEM globally; MSYS2_ROOT is not a global
      # env var, so PowerShell steps (e.g. Package binaries) see it as null.
      # Publish the Windows root path (the action's msys2-location output) as
      # MSYS2_ROOT for every following step.
      - name: Export MSYS2_ROOT for later (non-msys2) steps
        shell: powershell
        run: |
          $root = "${{ steps.msys2.outputs.msys2-location }}"
          if (-not $root) { throw "msys2-location output is empty" }
          Add-Content $env:GITHUB_ENV "MSYS2_ROOT=$root"
          Write-Host "MSYS2_ROOT exported: $root"

      - name: Install SDL2 (compat) via freshly-synced pacman DB
        shell: msys2 {0}
        run: |
          # The MSYS2 base image ships a stale repo.db: the plain 'sdl2' package
          # was removed from the live ucrt64 repo (replaced by sdl2-compat), so the
          # action's bundled DB can't resolve it. Sync the DB, then install.
          pacman -Sy --noconfirm
          if ! pacman -S --noconfirm mingw-w64-ucrt-x86_64-sdl2-compat; then
            echo "pacman still cannot resolve sdl2-compat — installing the package tarball directly"
            PKGURL="https://mirror.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-sdl2-compat-2.32.72-1-any.pkg.tar.zst"
            curl -fSL --retry 3 -o /tmp/sdl2c.tar.zst "$PKGURL"
            pacman -U --noconfirm /tmp/sdl2c.tar.zst
          fi
          # sanity: the .pc file must be visible to the SAME pkg-config configure will
          # invoke. Under --enable-cross-configure FFmpeg prefixes with cross_prefix, so
          # it calls the cross binary, not native 'pkg-config'.
          export PKG_CONFIG_PATH="$MSYS2_ROOT/ucrt64/lib/pkgconfig"
          XPCT="$MSYS2_ROOT/ucrt64/bin/x86_64-w64-mingw32-pkg-config"
          test -x "$XPCT" || { echo "FATAL: cross pkg-config not found: $XPCT"; exit 1; }
          "$XPCT" --modversion sdl2 || { echo "FATAL: cross pkg-config cannot resolve 'sdl2'"; "$XPCT" --list-all | head; exit 1; }
          echo "sdl2 OK via $(basename "$XPCT"): $("$XPCT" --modversion sdl2)"

      - name: Create prefixed tool shims (ucrt64 binutils ships unprefixed names)
        shell: msys2 {0}
        run: |
          # Modern ucrt64 binutils installs UNPREFIXED tools (ar, as, ld, dlltool,
          # objdump, strip, ...) in /ucrt64/bin; only the gcc package keeps the
          # x86_64-w64-mingw32- prefix. FFmpeg's --cross-prefix makes make invoke
          # $(AR)/$(STRIP)/$(OBJDUMP)/... WITH the prefix -> 'command not found'
          # (the gcc driver finds as/ld on its own, so only direct tool calls fail).
          # Fix: place a prefixed COPY next to each real tool (same dir, so the
          # tools' relative lookups are preserved). Copy (not symlink) so it works
          # regardless of whether the runner allows symlinks. Never clobber a
          # natively-provided prefixed binary.
          B="${MSYS2_ROOT//\\//}/ucrt64/bin"
          cd "$B"
          for t in addr2line ar as dlltool dllwrap elfedit gprof ld ld.bfd nm objcopy objdump ranlib readelf size strings strip windmc windres; do
            if [ -e "$t.exe" ] && [ ! -e "x86_64-w64-mingw32-$t.exe" ]; then
              cp "$t.exe" "x86_64-w64-mingw32-$t.exe"
              echo "shim: x86_64-w64-mingw32-$t = $t (copied)"
            fi
          done
          cd - >/dev/null
          # hard-fail if the exact tools make will call are still unresolvable
          for t in ar as ld dlltool objdump strip; do
            command -v "x86_64-w64-mingw32-$t" >/dev/null || { echo "FATAL: x86_64-w64-mingw32-$t not on PATH"; exit 1; }
          done
          x86_64-w64-mingw32-ar --version | head -1

      - name: Clone FFmpeg ${{ env.FFMPEG_TAG }}
        shell: bash
        run: git clone --depth 1 -b ${{ env.FFMPEG_TAG }} https://github.com/FFmpeg/FFmpeg.git ffmpeg

      - name: Apply NDI patch and stage NDI SDK into ffmpeg tree
        shell: msys2 {0}
        working-directory: ffmpeg
        run: |
          sed 's/\r$//' ../ndi-patch/ffmpeg_9.0-add_ndi.patch | patch -Np1
          cp ../ndi-patch/libavdevice/libndi_newtek_common.h libavdevice/
          cp ../ndi-patch/libavdevice/libndi_newtek_dec.c    libavdevice/
          cp ../ndi-patch/libavdevice/libndi_newtek_enc.c    libavdevice/
          mkdir -p ndi-sdk
          cp ../ndi-sdk/* ndi-sdk/

          # Build a PROPER GNU import library (configure links with -lndi).
          # dlltool's -d takes a DEF file, NOT a DLL — passing the DLL gives
          # 'Syntax error in def file ...:0' plus a stub libndi.dll.a, and the
          # final link then dies on undefined __imp_NDIlib_*. Correct flow:
          # extract the export table from the DLL -> def -> dlltool.
          # We parse the PE export table directly in Python (stdlib only)
          # instead of text-scraping `objdump -p` — that output format has
          # changed across binutils versions and broke the awk parse.
          DLL=ndi-sdk/Processing.NDI.Lib.x64.dll
          DEF=ndi-sdk/ndi-exports.def
          rm -f ndi-sdk/libndi.dll.a   # drop the PE-.lib copy staged as a fallback
          # the ucrt64 'python' package ships /ucrt64/bin/python.exe; keep a
          # fallback for runners where only python3 resolves
          command -v python >/dev/null || command -v python3 >/dev/null \
            || { echo "FATAL: no python interpreter in msys2 shell"; exit 1; }
          PYTHON_BIN=$(command -v python || command -v python3)
          "$PYTHON_BIN" - "$DLL" "$DEF" <<'PYEOF'
          import struct, sys
          dll_path, def_path = sys.argv[1], sys.argv[2]
          d = open(dll_path, 'rb').read()
          pe = struct.unpack_from('<I', d, 0x3C)[0]
          assert d[pe:pe+4] == b'PE\x00\x00', "not PE"
          nsec   = struct.unpack_from('<H', d, pe+6)[0]
          opthsz = struct.unpack_from('<H', d, pe+20)[0]
          opt    = pe + 24
          magic  = struct.unpack_from('<H', d, opt)[0]
          dd     = opt + (112 if magic == 0x20b else 96)
          exp_rva, _ = struct.unpack_from('<II', d, dd)
          if not exp_rva:
              sys.exit("no export directory")
          sec_off = opt + opthsz
          secs = []
          for i in range(nsec):
              o = sec_off + i*40
              vsize, va, rawsz, rawptr = struct.unpack_from('<IIII', d, o+8)
              secs.append((va, vsize, rawptr))
          def va2off(va):
              for (s_va, s_vs, ro) in secs:
                  if s_vs and s_va <= va < s_va + s_vs:
                      return ro + (va - s_va)
              return None
          er = va2off(exp_rva)
          if er is None:
              sys.exit(f"export RVA {exp_rva:#x} not mapped")
          # IMAGE_EXPORT_DIRECTORY (NO magic field — first DWORD is Characteristics)
          nfunc   = struct.unpack_from('<I', d, er+20)[0]
          nnames  = struct.unpack_from('<I', d, er+24)[0]
          names_rva = struct.unpack_from('<I', d, er+32)[0]
          names = va2off(names_rva)
          out = []
          for i in range(nnames):
              rva = struct.unpack_from('<I', d, names + 4*i)[0]
              o = va2off(rva)
              e = d.index(b'\0', o)
              out.append(d[o:e].decode('utf-8', 'replace'))
          with open(def_path, 'w', newline='') as f:
              f.write('LIBRARY "Processing.NDI.Lib.x64.dll"\nEXPORTS\n')
              for s in out:
                  f.write('  ' + s + '\n')
          print(f"parsed {len(out)} exports from {dll_path}")
          PYEOF
          NEXP=$(grep -c '^  ' "$DEF" || true)
          if [ "$NEXP" -lt 20 ]; then
            echo "FATAL: only $NEXP NDI exports extracted from $DLL"
            head -20 "$DEF"
            exit 1
          fi
          echo "NDI exports extracted: $NEXP"
          # NOTE: no --no-idata — that suppresses the .idata section and with it
          # the __imp_* definitions the link line resolves against.
          x86_64-w64-mingw32-dlltool --kill-at \
              -d "$DEF" -l ndi-sdk/libndi.dll.a -D "Processing.NDI.Lib.x64.dll" \
            || { echo "FATAL: dlltool failed"; head -20 "$DEF"; exit 1; }
          # the import lib must actually define the __imp_ stubs the code references
          for sym in NDIlib_initialize NDIlib_recv_create_v3 NDIlib_send_create NDIlib_find_create_v2; do
            x86_64-w64-mingw32-nm ndi-sdk/libndi.dll.a | grep -q "__imp_$sym" \
              || { echo "FATAL: __imp_$sym missing from libndi.dll.a"; exit 1; }
          done
          echo "libndi.dll.a OK"
          ls -la ndi-sdk

      - name: Configure FFmpeg
        shell: msys2 {0}
        working-directory: ffmpeg
        env:
          PKG_CONFIG_PATH: ${{ env.MSYS2_ROOT }}/ucrt64/lib/pkgconfig
        run: |
          ./configure \
            --cross-prefix=x86_64-w64-mingw32- \
            --target-os=win32 \
            --arch=x86_64 \
            --enable-cross-compile \
            --enable-nonfree \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-network \
            --disable-debug \
            --enable-libndi_newtek \
            --extra-cflags="-I`pwd`/ndi-sdk" \
            --extra-libs="-L`pwd`/ndi-sdk" \
            | tee configure.log
          echo "--- external libs summary ---"
          grep -A40 "^External libraries:" configure.log | grep -E "libndi_newtek|sdl2|zlib" || true
          # hard-fail if either NDI or SDL2 (needed for ffplay) was not enabled —
          # otherwise make would silently skip ffplay and ship a broken zip
          grep -A40 "^External libraries:" configure.log | grep -q "libndi_newtek" || { echo "FATAL: libndi_newtek not enabled"; tail -n 40 configure.log; exit 1; }
          grep -A40 "^External libraries:" configure.log | grep -q "sdl2"           || { echo "FATAL: sdl2 not enabled (ffplay will be missing)"; tail -n 40 configure.log; exit 1; }
          echo "OK: libndi_newtek + sdl2 enabled"

      - name: Build FFmpeg
        shell: msys2 {0}
        working-directory: ffmpeg
        run: make -j2

      - name: Version and NDI import check
        shell: msys2 {0}
        working-directory: ffmpeg
        run: |
          # The exes are native Windows PEs. When launched from the msys2 shell
          # their Windows loader only searches the exe's own dir + the Windows
          # PATH. ffmpeg.exe imports Processing.NDI.Lib.x64.dll (it links -lndi)
          # which lives in ndi-sdk/ — not on that search path — so the loader
          # fails before any output -> MSYS2 'cannot open shared object file' ->
          # exit 127. Stage the full runtime DLL set next to the exes (identical
          # layout to the shipped zip) so every dependency resolves.
          B="${MSYS2_ROOT//\\//}/ucrt64/bin"
          cp -f ndi-sdk/Processing.NDI.Lib.x64.dll .
          for d in SDL3.dll SDL2.dll libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            if [ -f "$B/$d" ]; then cp -f "$B/$d" .; else echo "note: $d not in ucrt64/bin"; fi
          done
          ls -la *.dll
          test -f ffmpeg.exe  || { echo "FATAL: ffmpeg.exe missing";  exit 1; }
          test -f ffprobe.exe || { echo "FATAL: ffprobe.exe missing"; exit 1; }
          test -f ffplay.exe  || { echo "FATAL: ffplay.exe missing (SDL2 not linked?)"; exit 1; }
          ./ffmpeg.exe -version
          ./ffprobe.exe -version | head -1
          ./ffplay.exe -version | head -1
          x86_64-w64-mingw32-objdump -p ffmpeg.exe | grep -i "Processing.NDI" || echo "WARN: NDI import not found"

      - name: Verify NDI devices are registered
        shell: msys2 {0}
        working-directory: ffmpeg
        run: |
          cp ndi-sdk/*.dll .
          ./ffmpeg.exe -hide_banner -devices 2>&1 | tee devices.log
          grep -q "libndi_newtek" devices.log || { echo "libndi_newtek missing from -devices"; exit 1; }
          echo "OK: NDI in/out devices registered"

      - name: NDI loopback test (transmit -> receive -> decode)
        shell: msys2 {0}
        working-directory: ffmpeg
        run: |
          # The msys2 custom shell runs bash with -e (errexit). A single failing
          # line aborts the whole script BEFORE the later diagnostic echoes run.
          # Disable errexit for this step and always print the logs. Do NOT rely
          # on the coreutils `timeout` binary; use a pure-bash watchdog.
          set +e

          # 1) local NDI source: 256x144 UYVY 25fps + 44.1 kHz sine, PCM s16
          ./ffmpeg.exe -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc=size=256x144:rate=25" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -map 0:v -map 1:a \
            -c:v wrapped_avframe -pix_fmt uyvy422 -c:a pcm_s16le \
            -f libndi_newtek "hermes_ci_source" \
            > transmit.log 2>&1 &
          TX_PID=$!

          # 2) WAIT for the source to actually be discoverable. The demuxer's
          #    wait_sources default is only 1 s, and NDI source registration
          #    (ffmpeg.exe load + NDI init + source announce) can take longer —
          #    a same-instant receiver then finds 0 sources -> "No such device".
          #    -find_sources lists discovered sources and exits rc=0, so we can
          #    poll it in a loop instead of racing.
          SRC_UP=0
          SRC_NAME=""
          for i in $(seq 1 60); do
            if ! kill -0 $TX_PID 2>/dev/null; then
              echo "transmitter died early:"; cat transmit.log; exit 1
            fi
            # -find_sources lists discovered sources (logged at INFO — hence
            # -loglevel info) and exits. Note: the CLI parses wait_sources in
            # SECONDS (range 0.1–20), not the raw microseconds of the AVOption.
            # 10 s per probe is plenty for the source to appear; the loop retries.
            ./ffmpeg.exe -hide_banner -loglevel info -y \
              -f libndi_newtek -find_sources 1 -wait_sources 10 -extra_ips 127.0.0.1 -i "dummy" \
              > discover.log 2>&1
            if grep -q "hermes_ci_source" discover.log; then
              SRC_UP=1
              # NDI registers the source as "<machine> (<source>)" — the demuxer
              # matches the URL against p_ndi_name EXACTLY, so capture the real
              # name from the "Found NDI sources" listing (first quoted field).
              SRC_NAME=$(grep -oE "'[^']*hermes_ci_source[^']*'" discover.log | head -1 | tr -d "'")
              break
            fi
            sleep 1
          done
          if [ $SRC_UP -ne 1 ] || [ -z "$SRC_NAME" ]; then
            echo "source never discovered; last discovery output:"
            cat discover.log; echo "transmit.log:"; tail -n 15 transmit.log; exit 1
          fi
          echo "source discovered after ${i}s — actual NDI name: '$SRC_NAME'"

          # 3) capture it back; -t 5 self-terminates after 5 s of output.
          #    wait_sources is in SECONDS here (max 20).
          ./ffmpeg.exe -hide_banner -loglevel info -y \
            -f libndi_newtek -wait_sources 20 -extra_ips 127.0.0.1 -i "$SRC_NAME" \
            -t 5 -c copy out.mkv > receive.log 2>&1 &
          RX_PID=$!
          for i in $(seq 1 120); do
            if ! kill -0 $RX_PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $RX_PID 2>/dev/null; then
            echo "receiver still running after 120s (hang) — killing"
            kill $RX_PID 2>/dev/null
          fi
          wait $RX_PID; RC=$?
          kill $TX_PID 2>/dev/null || true
          wait $TX_PID 2>/dev/null || true
          echo "receive rc=$RC"
          echo "===== receive.log (tail) ====="; tail -n 25 receive.log
          echo "===== transmit.log (tail) ====="; tail -n 15 transmit.log
          [ $RC -eq 0 ] || { echo "loopback capture failed"; exit 1; }

          # 3) verify content: rawvideo + pcm_s16le streams, real frames
          ./ffmpeg.exe -hide_banner -i out.mkv 2>&1 | tee outinfo.log
          grep -q "rawvideo"  outinfo.log || { echo "no rawvideo stream"; exit 1; }
          grep -q "pcm_s16le" outinfo.log || { echo "no pcm audio stream"; exit 1; }
          # Count frames with ffprobe (no output file needed; `ffmpeg -f null -`
          # is rejected by the Windows build: "At least one output file must be
          # specified"). -v error => stdout is just the frame count.
          FRAMES=$(./ffprobe.exe -v error -count_frames -select_streams v:0 \
            -show_entries stream=nb_read_frames -of default=nw=1:nk=1 out.mkv 2>/dev/null)
          FRAMES=${FRAMES//[!0-9]/}
          echo "decoded video frames: ${FRAMES:-0}"
          [ "${FRAMES:-0}" -ge 25 ] || { echo "too few frames decoded (${FRAMES:-0})"; exit 1; }
          echo "NDI LOOPBACK OK"

      - name: Package binaries
        shell: powershell
        run: |
          $pkg = "ffmpeg-9.0.1-ndi-win-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item ffmpeg/ffmpeg.exe  $pkg/
          Copy-Item ffmpeg/ffprobe.exe $pkg/
          Copy-Item ffmpeg/ffplay.exe  $pkg/
          Copy-Item ffmpeg/ndi-sdk/Processing.NDI.Lib.x64.dll $pkg/
          if (Test-Path ffmpeg/ndi-sdk/Version.txt) { Copy-Item ffmpeg/ndi-sdk/Version.txt $pkg/ }

          $ucrtBin = Join-Path $env:MSYS2_ROOT "ucrt64/bin"
          foreach ($d in @("SDL3.dll","SDL2.dll","libgcc_s_seh-1.dll","libwinpthread-1.dll","libstdc++-6.dll")) {
            $src = Join-Path $ucrtBin $d
            if (Test-Path $src) { Copy-Item $src $pkg/ } else { Write-Host "note: $d not found in ucrt64/bin" }
          }
          Copy-Item README.md $pkg/

          Get-ChildItem $pkg | Format-Table Name, Length
          Compress-Archive -Path $pkg -DestinationPath "ffmpeg-9.0.1-ndi-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-9.0.1-ndi-win-x64
          path: |
            ffmpeg-9.0.1-ndi-win-x64.zip
            ffmpeg/devices.log
          if-no-files-found: error

      - name: Upload loopback test logs (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndi-loopback-logs
          path: |
            ffmpeg/transmit.log
            ffmpeg/receive.log
            ffmpeg/outinfo.log
          if-no-files-found: ignore

      - name: Publish GitHub Release (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-9.0.1-ndi-win-x64-${{ github.run_number }}
          name: FFmpeg 9.0.1 + NDI (win-x64) — run ${{ github.run_number }}
          files: |
            ffmpeg-9.0.1-ndi-win-x64.zip
            ffmpeg/devices.log
          draft: false
          prerelease: true
          generate_release_notes: true
